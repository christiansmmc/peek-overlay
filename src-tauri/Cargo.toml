[package]
name = "perf-overlay"
version = "0.2.0"
description = "Peek: overlay de desempenho"
edition = "2024"
rust-version = "1.90"

[lib]
name = "perf_overlay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
overlay-engine = { path = "../crates/engine" }
